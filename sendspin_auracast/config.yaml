# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Sendspin Auracast
version: "0.2.0"
slug: sendspin_auracast
description: Sendspin Auracast app
url: "https://github.com/Yagoor/app-sendspin-auracast/tree/main/sendspin_auracast"
arch:
  - aarch64
  - amd64
uart: true
init: false
host_network: true
options:
  music_assistant_url: "ws://localhost:8927/sendspin"
  transport: "serial:/dev/ttyACM0,1000000"
  extra_args: "--manufacturer-data 87:00000000000000000000000000000000dffd"
  name: "Sendspin Auracast"
  initial_volume: 100
schema:
  music_assistant_url: "str?"
  transport: "str?"
  extra_args: "str?"
  name: "str?"
  initial_volume: "int?"
image: "ghcr.io/yagoor/app_sendspin_auracast"
